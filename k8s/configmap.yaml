---
apiVersion: v1
kind: ConfigMap
metadata:
  name: casbin-gateway-config
  namespace: casbin-gateway
data:
  app.conf: |
    appname = casbin-gateway
    httpport = 17000
    runmode = prod
    SessionOn = true
    copyrequestbody = true
    # A SQLite file on the PersistentVolumeClaim. For MySQL, set
    # driverName = mysql and dataSourceName = root:PASSWORD@tcp(host:3306)/
    driverName = sqlite
    dataSourceName = /data/casbin-gateway.db
    dbName = casbin_gateway
    redisEndpoint =
    gatewayEnabled = false
    gatewayHttpPort = 80
    gatewayHttpsPort = 443
    httpProxy = ""
    # Update this if your Casdoor is deployed elsewhere
    # Format: http://service-name.namespace.svc.cluster.local:port
    casdoorEndpoint = http://casdoor.casdoor-system.svc.cluster.local:8000
    casdoorInsecureSkipVerify = true
    clientId = "CLIENT_ID_PLACEHOLDER"
    clientSecret = "CLIENT_SECRET_PLACEHOLDER"
    casdoorOrganization = "built-in"
    casdoorApplication = "app-casdoor-gateway"
    isDemoMode = false
    appDir = "/app"
    dbRegionId = ""
    dbAccessKeyId = ""
    dbAccessKeySecret = ""
    dbInstanceId = ""
    dbHost = ""
    dbUser = ""
    dbPass = ""
    clientIdPrefix = ""
    clientSecretPrefix = ""
    language = "en"
    appMap =
    acmeEmail = ""
    acmePrivateKey = ""
