---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: casbin-gateway-ingress
  namespace: casbin-gateway
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    # Add SSL redirect if needed
    # nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: casbin-gateway.example.com  # Change this to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: casbin-gateway
                port:
                  number: 17000
  # Uncomment and configure TLS if you have certificates
  # tls:
  #   - hosts:
  #       - casbin-gateway.example.com
  #     secretName: casbin-gateway-tls
