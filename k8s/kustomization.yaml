---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: casbin-gateway

resources:
  - namespace.yaml
  - pvc.yaml
  - secret.yaml
  - configmap.yaml
  - deployment.yaml
  - ingress.yaml

# You can customize common labels here
commonLabels:
  app.kubernetes.io/name: casbin-gateway
  app.kubernetes.io/part-of: casbin-gateway

# You can add configuration transformers here
# For example, to change the namespace:
# namespace: my-custom-namespace
