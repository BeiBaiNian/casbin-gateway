version: '3.1'
services:
  casbin-gateway:
    restart: always
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "17000:17000"
    environment:
      RUNNING_IN_DOCKER: "true"
    volumes:
      - ./conf:/conf/
      # Holds the SQLite database, so the data survives "docker compose down".
      - casbin-gateway-data:/data

volumes:
  casbin-gateway-data:
