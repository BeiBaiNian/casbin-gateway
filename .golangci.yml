version: "2"

linters:
  default: none
  enable:
    - govet
    - misspell
  settings:
    govet:
      disable:
        # Reports every stdlib call that the newer toolchain golangci-lint is
        # built with cannot inline into a "go 1.20" file. Not actionable here.
        - inline

formatters:
  enable:
    - gofmt
    - goimports
